<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Portafolio</title>
    <link rel="stylesheet" href="yupi.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="portafolios.html">Portafolios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contacto</h1>

        <section id="formulario-contacto">
            <h2>Envíame un mensaje</h2>
            <form action="#" method="post">
                <label for="nombre">Nombre completo <span class="required">*</span></label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono <span class="required">*</span></label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="asunto">Asunto</label>
                <select id="asunto" name="asunto">
                    <option value="consulta">Consulta</option>
                    <option value="proyecto">Proyecto</option>
                    <option value="trabajo">Trabajo</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="mensaje">Mensaje <span class="required">*</span></label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <label>
                    <input type="checkbox" name="politicas" required>
                    Acepto las políticas de privacidad <span class="required">*</span>
                </label>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <section id="info-contacto">
            <h2>Información de contacto</h2>
            <table>
                <thead>
                    <tr>
                        <th>Método de contacto</th>
                        <th>Detalle</th>
                        <th>Horario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Email</td>
                        <td>xXBenito_CameloXx@gmail.com</td>
                    </tr>
                    <tr>
                        <td>Teléfono</td>
                        <td>+52 1469 6705</td>
                    </tr>
                    <tr>
                        <td>Oficina</td>
                        <td>X'box, Yucatan</td>
                    </tr>
                </tbody>
            </table>
            <img src="Imagenes/mapa.png" alt="Mapa de ubicación" width="600" height="400">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rogelio Centeno. Todos los derechos reservados.</p>
        <p><a href="index.html">Inicio</a> | <a href="portafolios.html">Portafolios</a> | <a href="contacto.html">Contacto</a></p>
    </footer>
</body>
</html>
